plugins {
    id "com.android.application"
}

// A versão do APK acompanha a do app de mesa (package.json da raiz).
def pacote = new groovy.json.JsonSlurper().parse(file("../../package.json"))
// -PversaoTeste=3.7.3 gera um APK "mais velho" para testar o atualizador.
def versao = project.findProperty("versaoTeste") ?: pacote.version
def (maior, menor, rev) = versao.tokenize(".")*.toInteger()

android {
    namespace "com.vcall.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.vcall.app"
        minSdk 26
        targetSdk 36
        versionName versao
        versionCode maior * 10000 + menor * 100 + rev
    }

    // Assinatura de release: a chave fica FORA do repositório. Sem ela, o
    // assembleRelease sai sem assinar (e o Android recusa instalar).
    def chave = System.getenv("VCALL_ANDROID_KEYSTORE")
    signingConfigs {
        if (chave) {
            release {
                storeFile file(chave)
                storePassword System.getenv("VCALL_ANDROID_SENHA")
                keyAlias System.getenv("VCALL_ANDROID_ALIAS") ?: "vcall"
                keyPassword System.getenv("VCALL_ANDROID_SENHA")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (chave) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A tela inicial usa a logo vetorial e a fonte do app, sem cópia no repositório.
    sourceSets.main.assets.srcDirs += "build/generated/vcall-assets"
}

def copiarMarca = tasks.register("copiarMarca", Copy) {
    from("../../brand/vcall-simbolo.svg") { into "inicio" }
    from("../../public/fonts/bricolage-latin.woff2") { into "inicio" }
    // A tela de erro é a mesma do app de mesa (public/erro.html), na paleta
    // da pessoa: vai inteira para dentro do APK, com o que ela usa.
    from("../../public") {
        include "erro.html", "js/erro.js", "js/ui/tela-erro.js", "js/ui/ilustracao.js", "js/lib/dom.js",
                "js/boot-tema.js", "css/tokens.css", "css/paletas.css", "css/base.css", "css/app.css",
                "css/motion.css", "css/call.css", "assets/illustrations/desconectado.svg",
                "assets/logo-mark.svg", "assets/favicon-64.png", "vendor/icons.svg", "fonts/*.woff2"
    }
    into "build/generated/vcall-assets"
}
tasks.named("preBuild") { dependsOn copiarMarca }

dependencies {
    testImplementation "junit:junit:4.13.2"
}

# Publica docs/wiki/ na aba Wiki do GitHub a cada alteração no main.
#
# A wiki precisa existir: na primeira vez, abra a aba "Wiki" do repositório e
# clique em "Create the first page" (qualquer conteúdo — este workflow
# substitui tudo). Depois disso é automático.
name: Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar as páginas para a wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki || {
            echo "::error::A wiki ainda não existe. Abra a aba Wiki e clique em 'Create the first page', depois rode este workflow de novo."
            exit 1
          }
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki já atualizada."; exit 0; fi
          git commit -m "Wiki: ${GITHUB_SHA::7}"
          git push

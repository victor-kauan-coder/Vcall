# ------------------------------------------------------------------ #
# electron-builder.yml — empacotamento do Vcall como app desktop.
#
# O que vai no pacote: o servidor (src/, server.js), a interface (public/),
# o processo principal (desktop/) e o mínimo de dependências de produção.
# Tudo é empacotado em um arquivo asar, e o executável final não expõe uma
# árvore de arquivos editável ao usuário.
#
# NOTA HONESTA SOBRE "PROIBIR ALTERAÇÃO": asar é empacotamento, não
# criptografia — quem souber o que está fazendo consegue extrair o conteúdo.
# Nenhum formato de app desktop impede isso de verdade, porque o código
# precisa ser executável na máquina do usuário. O que o asar garante é que o
# código não fica à mão para ser editado por acidente ou por curiosidade.
# Para elevar a barreira, veja "Proteção do código" no README-DESKTOP.md.
# ------------------------------------------------------------------ #

appId: com.vcall.desktop
productName: Vcall
copyright: Vcall

directories:
  output: dist
  buildResources: brand

# O entry point do Electron é outro do entry point do servidor em npm start.
extraMetadata:
  main: desktop/main.js

files:
  - server.js
  - src/**/*
  - public/**/*
  - desktop/**/*
  - package.json
  - "!**/*.map"
  - "!scripts/**"
  - "!dist/**"

asar: true

# Linux: o executável "vcall" vira um lançador que decide o sandbox antes do
# Chromium subir (scripts/linux/vcall.sh); o Electron vira o vcall-bin.
afterPack: scripts/linux/depois-de-empacotar.cjs

# Atualização automática (desktop/atualizador.js). Com isto o build grava o
# app-update.yml dentro do app e gera latest.yml / latest-linux.yml, que o
# workflow de release publica junto dos instaladores. O CI usa --publish never:
# quem sobe os arquivos é o próprio workflow, depois de assiná-los.
publish:
  - provider: github
    owner: victor-kauan-coder
    repo: vcall
    releaseType: release

protocols:
  - name: Vcall
    schemes: [vcall]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/assets/icon-512.png
  # O cloudflared vai ao lado do Vcall.exe, onde desktop/tunnel.js procura
  # primeiro: o link público funciona sem baixar nada na hora.
  extraFiles:
    - from: .cache-cloudflared/win32-cloudflared.exe
      to: cloudflared.exe
    # O SFU de quem transmite (desktop/sfu.js), conferido por SHA256 no build.
    - from: .cache-livekit/livekit-server.exe
      to: livekit-server.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Vcall
  createDesktopShortcut: always
  runAfterFinish: true
  artifactName: VcallSetup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.social-networking
  icon: public/assets/icon-512.png
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: O Vcall precisa da câmera para o seu vídeo na chamada.
    NSMicrophoneUsageDescription: O Vcall precisa do microfone para a sua voz na chamada.

# Linux: um formato para cada família de distribuição, mais o AppImage, que
# roda em qualquer uma sem instalar nada.
#   AppImage  qualquer distro (Fedora, Arch, Ubuntu, openSUSE, Mint…)
#   deb       Debian, Ubuntu, Mint, Pop!_OS, elementary
#   rpm       Fedora, openSUSE, RHEL, Rocky, Alma
#   pacman    Arch, Manjaro, EndeavourOS, CachyOS
#   tar.gz    qualquer distro, descompactar e rodar
# Os pacotes instalam o .desktop (link vcall://) e deixam o chrome-sandbox
# setuid root (scripts/linux/depois-de-instalar.tpl); o AppImage registra o
# .desktop sozinho na primeira execução (desktop/linux.js).
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: pacman
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Network
  executableName: vcall
  # Mesma promessa do Windows: o cloudflared viaja junto, e o link público
  # funciona sem baixar nada na hora. desktop/tunnel.js procura ao lado do
  # executável antes de pensar em rede.
  extraFiles:
    - from: .cache-cloudflared/linux-cloudflared
      to: cloudflared
    - from: .cache-livekit/livekit-server
      to: livekit-server
  maintainer: Victor Kauan <victor.kufpi@gmail.com>
  vendor: Vcall
  synopsis: Chamadas de vídeo P2P criptografadas, com canvas colaborativo
  description: >-
    Salas de vídeo ponto a ponto criptografadas fim a fim, com compartilhamento
    de tela e de janelas, canvas colaborativo, legendas offline e moderação.
  artifactName: Vcall-${version}-${arch}.${ext}
  icon: public/assets/icon-512.png
  desktop:
    MimeType: x-scheme-handler/vcall
    StartupWMClass: Vcall
    Keywords: video;call;chamada;reuniao;webrtc;

# Dependências de sistema que os pacotes pedem ao gerenciador. O compartilhar
# tela no Wayland usa o portal (xdg-desktop-portal) com PipeWire. libgbm e
# libasound (e libexpat no Fedora) o Electron carrega direto: sem elas, numa
# instalação mínima o app não abre.
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libgbm1, libasound2]
  recommends: [xdg-desktop-portal, pipewire]
  afterInstall: scripts/linux/depois-de-instalar.tpl
# No .rpm, pelo nome da biblioteca: o Fedora e o openSUSE dão nomes diferentes
# aos pacotes (libXtst / libXtst6), mas as duas publicam o mesmo libXtst.so.6.
rpm:
  depends:
    - libgtk-3.so.0()(64bit)
    - libnotify.so.4()(64bit)
    - libnss3.so()(64bit)
    - libXss.so.1()(64bit)
    - libXtst.so.6()(64bit)
    - libatspi.so.0()(64bit)
    - libuuid.so.1()(64bit)
    - libgbm.so.1()(64bit)
    - libasound.so.2()(64bit)
    - libexpat.so.1()(64bit)
    - xdg-utils
  afterInstall: scripts/linux/depois-de-instalar.tpl
pacman:
  depends: [gtk3, libnotify, nss, libxss, libxtst, xdg-utils, at-spi2-core, util-linux-libs, alsa-lib]
  afterInstall: scripts/linux/depois-de-instalar.tpl
